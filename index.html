<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="styless.css">
</head>
<body>
    <header class="header">
        <h1>Parcial 1 - Division 131</h1>
    </header>

    <main>
        <h1 id="titulo-users">Users</h1>
        <hr>

        <section class="controles">
            <div class="filtros">
                <div class="radios">
                <label><input type="radio" name="estado" value="active">Active</input></label>
                <label><input type="radio" name="estado" value="inactive">Inactive</input></label>
                <label><input type="radio" name="estado" value="All">All</input></label>
            </div>
            <div class="botones">
                <button type="buttom" class="btn btn-create">Create</button>
                <button type="buttom" class="btn btn-deactivate">Desactive</button>
                <button type="buttom" class="btn btn-reset">Reset Password</button>
            </div>
        </div>    
        <input text="text" id="buscador" placeholder="Search Users">
        </section>

        <div id="users-conteiner"></div>
    </main>

    <footer>
        <p>Valentino Garbuglio</p>
    </footer>

    <script src="index.js"></script>
</body>
</html>
